<style>

:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:11px 16px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.1);transition:transform .08s,box-shadow .15s,filter .15s}

button.print{background:linear-gradient(180deg,#f5a03a,#d9730d);border-color:#d9730d;color:#fff}
button.dark{background:linear-gradient(180deg,#475569,#2f3b4c);border-color:#2f3b4c;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row>*{flex:1 1 150px}
.sheet{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:12px;overflow-x:auto}

pre{margin:0;font:11px/1.25 "Courier New",Courier,monospace;white-space:pre}
.note{font-size:13px;color:var(--mut);margin:8px 0 0}
.msg{font-size:14px;margin-top:8px;min-height:20px}

</div>

<div id="npw" style="display:none;position:fixed;inset:0;z-index:40"><div id="np" style="position:absolute;top:calc(env(safe-area-inset-top,0px) + 56px);right:12px;left:12px;max-width:420px;margin-left:auto;max-height:70vh;overflow:auto;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)"><div style="display:flex;align-items:center"><strong style="flex:1">🔔 Notifikasi</strong><button id="npx" type="button" aria-label="Tutup" style="padding:4px 10px">✕</button></div><div id="npl"></div><div class="row" style="margin:10px 0 0"><button id="npr" type="button" style="display:none">✔️ Tandai semua dibaca</button><button id="npn" type="button" style="display:none">🔔 Aktifkan notifikasi</button></div></div></div>
<div id="dlg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;align-items:center;justify-content:center;padding:16px"><div style="background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:16px;width:100%;max-width:340px"><h2 id="dtl"></h2><label for="dp">Password</label><input id="dp" type="password" autocomplete="off"><div id="dp2w" style="display:none;margin-top:8px"><label for="dp2">Ulangi password</label><input id="dp2" type="password" autocomplete="off"></div><p class="note" id="derr" style="color:#c0392b;min-height:18px"></p><div class="row"><button class="p" id="dok" type="button">✅ OK</button><button class="gray" id="dcn" type="button">✖️ Batal</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var $=function(s){return document.querySelector(s)};
var F=['no','dt','nm','pt','dr','dk','sp','pw','gd','pk','pn','jd','pg','sd'];
var JD='SURAT JALAN KELUAR BARANG - MANIKA STONE ART';
var SB_URL='https://alnmjxyyfhkytwkwzpon.supabase.co',SB_KEY='sb_publishable_DaL5YRZ7cIVN52tEiz3REw_u2s9Pu2g';
var S={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function itemRow(d){
 d=d||{};
 var e=document.createElement('div');e.className='item';
 e.innerHTML='<div class="n"><label>Nama barang</label><input class="in" autocapitalize="characters"></div>'+
 '<div><label>Jumlah</label><input class="iq" inputmode="decimal"></div>'+
 '<div><label>Satuan</label><input class="is"></div>'+
 '<div class="k"><label>Keterangan (opsional)</label><input class="ik" autocapitalize="characters"></div>';
 e.querySelector('.in').value=d.n||'';e.querySelector('.iq').value=d.q||'';
 e.querySelector('.is').value=d.s||'';e.querySelector('.ik').value=d.k||'';
 $('#items').appendChild(e);
}
function getItems(){
 return Array.prototype.map.call(document.querySelectorAll('.item'),function(e){
  return {n:e.querySelector('.in').value.trim(),q:e.querySelector('.iq').value.trim(),
  s:e.querySelector('.is').value.trim(),k:e.querySelector('.ik').value.trim()};
 }).filter(function(i){return i.n||i.q});
}
function getData(){var d={};F.forEach(function(f){d[f]=$('#'+f).value});d.items=getItems();return d}
function setData(d){F.forEach(function(f){if(d[f]!=null&&f!=='pg')$('#'+f).value=d[f]});loadDr();
 $('#items').innerHTML='';(d.items&&d.items.length?d.items:[{}]).forEach(itemRow);render()}

function U(s){return String(s||'').toUpperCase()}
function wrap(t,n){var o=[];String(t||'').split('\n').forEach(function(p){var l='';
 p.split(' ').forEach(function(w){var x=(l+' '+w).trim();if(x.length>n&&l){o.push(l);l=w}else l=x});o.push(l)});return o}
function pad(s,n){s=String(s);return s.length>=n?s.slice(0,n):s+' '.repeat(n-s.length)}
function rep(c,n){return c.repeat(n)}
function ctr(s,w){s=s.slice(0,w);var l=Math.floor((w-s.length)/2);return pad(' '.repeat(l)+s,w)}
function fmtDate(v){if(!v)return'';var p=v.split('-');return p[2]+'/'+p[1]+'/'+p[0]}

var COLS=73; // lebar teks (kolom, 10 cpi): sisakan margin kosong kanan = kiri
function build(d){
 var W=COLS,L=[];
 L.push(ctr(U(d.jd||JD),W));L.push('');
 L.push(pad('NAMA      : '+U(d.nm),52)+'TANGGAL  : '+fmtDate(d.dt));
 L.push(pad('NO PLAT   : '+U(d.pt),52)+'NO. SURAT: '+(d.no||'(otomatis)'));
 L.push('');
 L.push(pad('NO.',4)+pad('NAMA BARANG',30)+pad('JUMLAH',11)+'KETERANGAN');
 L.push(rep('─',W));
 var rows=[];
 d.items.forEach(function(it,i){
  var nm=wrap(U(it.n),28),jm=U((it.q+' '+it.s).trim());
  var kt=wrap(U(it.k||(i===0&&d.sp?'SPK '+d.sp.replace(/^SPK\s*/i,''):'')),28),r=Math.max(nm.length,kt.length,1);
  for(var j=0;j<r;j++)rows.push(pad(j?'':(i+1)+'.',4)+pad(nm[j]||'',30)+pad(j?'':jm,11)+(kt[j]||''));
 });
 while(rows.length<9)rows.push('');
 rows.forEach(function(r){L.push(r)});
 L.push(pad('',45)+(d.dr?'DARI '+U(d.dr):''));
 L.push(pad('',45)+(d.dk?'DIBAWA KE '+U(d.dk):''));
 L.push(rep('─',W));
 L.push(ctr('MENGETAHUI',W));L.push('');L.push('');L.push('');
 var SZ=[15,15,15,14,14];
 function nmc(v,z){return ctr(v?'('+U(v)+')':'(...........)',z)}
 var pbm=/\bPBM\b/i.test(d.dr||'');L.push((pbm?nmc(d.gd,SZ[0]):pad('',SZ[0]))+nmc(d.nm,SZ[1])+nmc(d.pw,SZ[2])+nmc(d.pk,SZ[3])+nmc(d.pn,SZ[4]));
 L.push((pbm?ctr('GUDANG',SZ[0]):pad('',SZ[0]))+ctr('PEMBAWA',SZ[1])+ctr('PENGAWAS',SZ[2])+ctr('PIKET KELUAR',SZ[3])+ctr('PENERIMA',SZ[4]));
 var len=28;
 while(L.length<len)L.push('');
 return L.map(function(x){return x.replace(/\s+$/,'')}).join('\n');
}
var RAW='';
function toHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/^─+$/gm,function(m){return '<span class="hr" style="width:'+m.length+'ch"></span>'})}
function render(){gdVis();var d=getData(),t=build(d);RAW=t;$('#pv').innerHTML=toHtml(t);$('#prp').innerHTML=toHtml(t.replace(/\s+$/,''));
 var st=document.getElementById('pgs');if(!st){st=document.createElement('style');st.id='pgs';document.head.appendChild(st)}
 var n=Math.max(28,t.split('\n').length);
 var fs=Number($('#fs').value)||13,ox=Number($('#ox').value)||0,left=Math.max(0,(9.5*72-COLS*0.6*fs)/2+ox*72/25.4);
 st.textContent='@page{size:9.5in '+(n/6)+'in;margin:0}@media print{#pr pre{font:'+fs+'pt/12pt "Courier New",Courier,monospace;padding-left:'+left.toFixed(1)+'pt}}';
 S.set('sj2_draft',d);S.set('sj2_pg',$('#pg').value);S.set('sj2_fs',$('#fs').value);S.set('sj2_ox',$('#ox').value);S.set('sj3_ml',$('#ml').value);S.set('sj2_bd',$('#bd').value)}

function msg(t,err){var m=$('#msg');m.textContent=t;m.style.color=err?'#c0392b':'inherit'}

function toBytes(text,len,draft,ml,bold){
 // reset, batal proporsional, paksa 10 cpi (pica), batal condensed & double-width, 6 baris/inci, panjang halaman, draft/LQ, tebal
 var b=[0x1b,0x40,0x1b,0x70,0,0x1b,0x50,0x12,0x1b,0x57,0,0x1b,0x32,0x1b,0x43,len,0x1b,0x78,draft?0:1,0x1b,bold?0x45:0x46];
 if(ml>0)b.push(0x1b,0x51,Math.min(255,COLS+ml),0x1b,0x6c,ml);
 text.split('\n').forEach(function(l){
  if(/^─+$/.test(l)){b.push(0x1b,0x2d,1);for(var k=0;k<l.length;k++)b.push(0x20);b.push(0x1b,0x2d,0)} // garis penuh: spasi bergaris-bawah
  else for(var i=0;i<l.length;i++){var c=l.charCodeAt(i);b.push(c<128?c:63)}
  b.push(13,10)});
 b.push(0x1b,0x43,0,22,0x0c,0x1b,0x40); // panjang halaman 22 inci lalu form feed: kertas terus maju sampai sensor paper-out; terakhir reset printer
 return new Uint8Array(b);
}
var UD=null,UEP=null,UIF=null;
if(navigator.usb)navigator.usb.addEventListener('disconnect',function(e){if(UD&&e.device===UD){UD=null;UEP=null;UIF=null}});
async function usbClose(reset){
 var d=UD,i=UIF;UD=null;UEP=null;UIF=null;
 if(!d)return;
 try{if(d.opened){if(i!==null)try{await d.releaseInterface(i)}catch(e){}if(reset)try{await d.reset()}catch(e){}await d.close()}}catch(e){}}
async function usbOpen(){
 if(UD&&UD.opened&&UEP!==null)return;
 var dev=null;
 try{var l=await navigator.usb.getDevices();dev=l.filter(function(d){return d.vendorId===0x04b8})[0]||null}catch(e){}
 if(!dev)dev=await navigator.usb.requestDevice({filters:[{vendorId:0x04b8},{classCode:7}]});
 if(!dev.opened)await dev.open();
 if(!dev.configuration)await dev.selectConfiguration(1);
 var ep=null,ifn=null;
 dev.configuration.interfaces.forEach(function(i){i.alternates.forEach(function(a){
  if(a.interfaceClass===7&&ep===null){a.endpoints.forEach(function(e){if(e.direction==='out'&&ep===null){ep=e.endpointNumber;ifn=i.interfaceNumber}})}})});
 if(ep===null){try{await dev.close()}catch(e){}throw new Error('Jalur cetak printer tidak ditemukan.')}
 UD=dev;UEP=ep;UIF=ifn;
 await dev.claimInterface(ifn);
 try{await dev.clearHalt('out',ep)}catch(e){}}
async function usbSend(data){
 for(var t=0;t<2;t++){
  try{
   await usbOpen();
   for(var o=0;o<data.length;o+=4096)await UD.transferOut(UEP,data.slice(o,o+4096));
   return;
  }catch(e){
   await usbClose(t===0);
   if((e&&e.name==='NotFoundError')||t===1)throw e;
  }
 }
}
async function usbPrint(){
 if(!navigator.usb){msg('Browser ini belum mendukung WebUSB. Pakai Chrome di Android, atau pilih cetak lewat browser.',1);return}
 try{
  var text=RAW,len=Math.max(28,text.split('\n').length);
  var ml=Math.max(0,Math.min(40,Math.round(Number($('#ml').value)||0)));
  var data=toBytes(text.replace(/\s+$/,''),Math.min(len,127),$('#sd').value==='1',ml,$('#bd').value==='1');
  await usbSend(data);
  msg('Terkirim ke printer.');markPrinted();
 }catch(e){
  msg(e&&e.name==='NotFoundError'?'Printer belum dipilih.':'Gagal mencetak: '+(e.message||e)+'. Cek kabel OTG dan pastikan printer menyala.',1);
 }
}

async function claimNumber(data){
 var p=(data.dt||today()).slice(0,7);
 var q=await db.from('suratjalan').select('seq').eq('periode',p).order('seq',{ascending:false}).limit(1);
 if(q.error)throw q.error;
 var n=q.data.length?q.data[0].seq+1:1;
 for(var t=0;t<80;t++){
  var id=pad4(n);
  var r=await db.from('suratjalan').insert({periode:p,no:id,seq:n,doc:data,created_at:Date.now(),dibaca:!!isAdmin});
  if(!r.error){data.no=id;curP=p;if(FY&&FY!==p.slice(0,4))FY=p.slice(0,4);if(FM&&FM!==p.slice(5,7))FM=p.slice(5,7);return id}
  if(r.error.code==='23505'){n++;continue}
  throw r.error;
 }

   .on('postgres_changes',{event:'*',schema:'public',table:'suratjalan'},function(p){loadHist().then(function(){if(p.eventType==='INSERT'&&isAdmin&&p.new&&!p.new.dibaca)alertNew(p.new)}).catch(function(){})})
   .on('postgres_changes',{event:'*',schema:'public',table:'sj_config'},function(){loadCfg()})
   .subscribe();
 }).catch(function(){clearTimeout(t);db=null;dbState='failed';drawHist()});
})();
